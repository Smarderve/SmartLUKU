<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SmartLUKU</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1f5a3d 0%, #2d7d54 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .register-box {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 580px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2.5rem;
        }
        
        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .register-header h1 {
            font-size: 2.2rem;
            color: #1f5a3d;
            margin-bottom: 0.5rem;
        }
        
        .register-header i {
            color: #fbbf24;
            margin-right: 0.5rem;
        }
        
        .register-header p {
            color: #6b7280;
            font-size: 0.95rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.6rem;
            font-weight: 500;
            color: #111827;
        }
        
        .form-group.required label::after {
            content: ' *';
            color: #dc2626;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.9rem;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: all 0.2s;
        }
        
        .form-group input:disabled,
        .form-group select:disabled {
            background-color: #f3f4f6;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #1f5a3d;
            box-shadow: 0 0 0 3px rgba(31, 90, 61, 0.1);
        }
        
        .btn-register {
            width: 100%;
            padding: 0.95rem;
            background: linear-gradient(135deg, #1f5a3d 0%, #2d7d54 100%);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1rem;
        }
        
        .btn-register:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(31, 90, 61, 0.3);
        }
        
        .divider {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #9ca3af;
            font-size: 0.9rem;
        }
        
        .login-section {
            text-align: center;
            font-size: 0.95rem;
        }
        
        .login-section a {
            color: #1f5a3d;
            text-decoration: none;
            font-weight: 600;
        }
        
        .login-section a:hover {
            text-decoration: underline;
        }
        
        .terms {
            font-size: 0.8rem;
            color: #6b7280;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        
        .terms a {
            color: #1f5a3d;
            text-decoration: none;
        }
        
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            display: none;
            border: 1px solid #fca5a5;
        }
        
        .form-section-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #1f5a3d;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #f0fdf4;
        }
        
        @media (max-width: 480px) {
            .register-box { padding: 1.5rem; }
            .register-header h1 { font-size: 1.75rem; }
            .form-row, .form-row-3 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="register-box">
        <div class="register-header">
            <h1><i class="fas fa-lightning-bolt"></i> SmartLUKU</h1>
            <p>Create Your Account</p>
        </div>
        
        <div class="error" id="errorMsg"></div>
        
        <form onsubmit="handleRegister(event)">
            <!-- Personal Information -->
            <div class="form-section-title">
                <i class="fas fa-user"></i> Personal Information
            </div>
            
            <div class="form-group required">
                <label for="meter">Meter Number (Required)</label>
                <input type="text" id="meter" placeholder="TZ-2024-001234" required>
            </div>
            
            <div class="form-row">
                <div class="form-group required">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" placeholder="John" required>
                </div>
                <div class="form-group required">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" placeholder="Doe" required>
                </div>
            </div>
            
            <div class="form-group required">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="your@email.com" required>
            </div>
            
            <div class="form-group required">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="+255712345678" required>
            </div>
            
            <!-- Location Information -->
            <div class="form-section-title">
                <i class="fas fa-map-marker-alt"></i> Location Information
            </div>
            
            <div class="form-group required">
                <label for="region">Region/City</label>
                <select id="region" onchange="populateDistricts()" required>
                    <option value="">Select Region</option>
                </select>
            </div>
            
            <div class="form-group required">
                <label for="district">District</label>
                <select id="district" onchange="populateStreets()" required disabled>
                    <option value="">Select District</option>
                </select>
            </div>
            
            <div class="form-group required">
                <label for="street">Street</label>
                <select id="street" required disabled>
                    <option value="">Select Street</option>
                </select>
            </div>
            
            <!-- Password Information -->
            <div class="form-section-title">
                <i class="fas fa-lock"></i> Security
            </div>
            
            <div class="form-group required">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 8 characters" required>
            </div>
            
            <div class="form-group required">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
            </div>
            
            <div class="terms">
                By registering, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
            </div>
            
            <button type="submit" class="btn-register">Create Account</button>
        </form>
        
        <div class="login-section">
            Already have an account? <a href="login.html">Sign in</a>
        </div>
    </div>
    
    <script src="src/js/tanzania-data.js"></script>
    <script>
        // Initialize region dropdown
        function initializeForm() {
            const regions = tanzaniaData.getRegions();
            const regionSelect = document.getElementById('region');
            
            regions.forEach(region => {
                const option = document.createElement('option');
                option.value = region.code;
                option.textContent = region.name;
                regionSelect.appendChild(option);
            });
        }
        
        function populateDistricts() {
            const regionCode = document.getElementById('region').value;
            const districtSelect = document.getElementById('district');
            const streetSelect = document.getElementById('street');
            
            // Reset dependent fields
            districtSelect.innerHTML = '<option value="">Select District</option>';
            streetSelect.innerHTML = '<option value="">Select Street</option>';
            districtSelect.disabled = !regionCode;
            streetSelect.disabled = true;
            
            if (regionCode) {
                const districts = tanzaniaData.getDistricts(regionCode);
                districts.forEach(district => {
                    const option = document.createElement('option');
                    option.value = district.code;
                    option.textContent = district.name;
                    districtSelect.appendChild(option);
                });
            }
        }
        
        function populateStreets() {
            const regionCode = document.getElementById('region').value;
            const districtCode = document.getElementById('district').value;
            const streetSelect = document.getElementById('street');
            
            streetSelect.innerHTML = '<option value="">Select Street</option>';
            streetSelect.disabled = !districtCode;
            
            if (regionCode && districtCode) {
                const streets = tanzaniaData.getStreets(regionCode, districtCode);
                streets.forEach(street => {
                    const option = document.createElement('option');
                    option.value = street;
                    option.textContent = street;
                    streetSelect.appendChild(option);
                });
            }
        }
        
        function handleRegister(event) {
            event.preventDefault();
            const meter = document.getElementById('meter').value.trim();
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const region = document.getElementById('region').value;
            const district = document.getElementById('district').value;
            const street = document.getElementById('street').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Validation
            if (!meter || !firstName || !lastName || !email || !phone || !region || !district || !street || !password) {
                showError('Please fill in all required fields');
                return;
            }
            
            if (password.length < 8) {
                showError('Password must be at least 8 characters');
                return;
            }
            
            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }
            
            if (!meter.match(/^[A-Z0-9\-]+$/)) {
                showError('Invalid meter number format');
                return;
            }
            
            // Get full location names
            const regionName = document.querySelector(`#region option[value="${region}"]`).textContent;
            const districtName = document.querySelector(`#district option[value="${district}"]`).textContent;
            
            // Store and redirect
            localStorage.setItem('smartluku-user', meter);
            localStorage.setItem('smartluku-theme', 'light');
            localStorage.setItem('smartluku-profile', JSON.stringify({
                meter, firstName, lastName, email, phone,
                region, regionName, district, districtName, street
            }));
            
            window.location.href = 'app.html';
        }
        
        function showError(msg) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
            setTimeout(() => {
                errorMsg.style.display = 'none';
            }, 4000);
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', initializeForm);
    </script>
</body>
</html>
