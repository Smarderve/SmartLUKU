<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SmartLUKU</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="bg-gray-50">
    <!-- Navigation Bar -->
    <nav class="sticky top-0 z-50 bg-white shadow-md border-b-4 border-primary">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition">
                    <i class="fas fa-lightning-bolt text-accent text-2xl"></i>
                    <span class="text-2xl font-bold text-primary">SmartLUKU</span>
                </a>
                <a href="index.html" class="text-gray-700 hover:text-primary transition">
                    <i class="fas fa-arrow-left"></i> Back Home
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="min-h-screen flex items-center justify-center py-12 px-4">
        <div class="w-full max-w-lg">
            <!-- Registration Card -->
            <div class="bg-white rounded-lg shadow-lg p-8">
                <div class="text-center mb-8">
                    <div class="inline-block bg-accent bg-opacity-10 rounded-full p-4 mb-4">
                        <i class="fas fa-user-plus text-accent text-4xl"></i>
                    </div>
                    <h1 class="text-3xl font-bold text-primary">Create Account</h1>
                    <p class="text-gray-600 mt-2">Join SmartLUKU and manage your electricity</p>
                </div>

                <!-- Registration Form -->
                <form id="registerForm" class="space-y-4">
                    <!-- Full Name -->
                    <div>
                        <label for="fullName" class="block text-sm font-medium text-gray-700 mb-2">
                            Full Name *
                        </label>
                        <div class="relative">
                            <i class="fas fa-user absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input 
                                type="text" 
                                id="fullName" 
                                name="fullName" 
                                required
                                placeholder="John Kipchoge"
                                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-accent"
                            >
                        </div>
                        <span class="error-message text-red-500 text-sm mt-1 hidden"></span>
                    </div>

                    <!-- Email Field -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                            Email Address *
                        </label>
                        <div class="relative">
                            <i class="fas fa-envelope absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                required
                                placeholder="your@email.com"
                                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-accent"
                            >
                        </div>
                        <span class="error-message text-red-500 text-sm mt-1 hidden"></span>
                    </div>

                    <!-- Phone Number -->
                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">
                            Phone Number (Optional)
                        </label>
                        <div class="relative">
                            <i class="fas fa-phone absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input 
                                type="tel" 
                                id="phone" 
                                name="phone" 
                                placeholder="+255 67X XXX XXX"
                                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-accent"
                            >
                        </div>
                        <span class="error-message text-red-500 text-sm mt-1 hidden"></span>
                    </div>

                    <!-- Meter Number -->
                    <div>
                        <label for="meterNumber" class="block text-sm font-medium text-gray-700 mb-2">
                            TANESCO Meter Number (Optional)
                        </label>
                        <div class="relative">
                            <i class="fas fa-barcode absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input 
                                type="text" 
                                id="meterNumber" 
                                name="meterNumber" 
                                placeholder="1234567890"
                                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-accent"
                            >
                        </div>
                        <span class="error-message text-red-500 text-sm mt-1 hidden"></span>
                    </div>

                    <!-- Password Field -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                            Password *
                        </label>
                        <div class="relative">
                            <i class="fas fa-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                required
                                placeholder="Min. 8 characters"
                                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-accent"
                            >
                            <button 
                                type="button" 
                                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 toggle-password"
                            >
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div id="passwordRequirements" class="mt-2 space-y-1">
                            <div class="flex items-center gap-2 text-sm">
                                <i class="fas fa-times text-red-500 req-length"></i>
                                <span class="text-gray-600">At least 8 characters</span>
                            </div>
                            <div class="flex items-center gap-2 text-sm">
                                <i class="fas fa-times text-red-500 req-upper"></i>
                                <span class="text-gray-600">One uppercase letter</span>
                            </div>
                            <div class="flex items-center gap-2 text-sm">
                                <i class="fas fa-times text-red-500 req-number"></i>
                                <span class="text-gray-600">One number</span>
                            </div>
                        </div>
                        <span class="error-message text-red-500 text-sm mt-1 hidden"></span>
                    </div>

                    <!-- Confirm Password -->
                    <div>
                        <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">
                            Confirm Password *
                        </label>
                        <div class="relative">
                            <i class="fas fa-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input 
                                type="password" 
                                id="confirmPassword" 
                                name="confirmPassword" 
                                required
                                placeholder="Confirm password"
                                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-accent"
                            >
                            <button 
                                type="button" 
                                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 toggle-password"
                            >
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <span class="error-message text-red-500 text-sm mt-1 hidden"></span>
                    </div>

                    <!-- Terms & Conditions -->
                    <div class="flex items-start gap-2">
                        <input type="checkbox" id="terms" name="terms" required class="w-4 h-4 mt-1">
                        <label for="terms" class="text-sm text-gray-700">
                            I agree to the 
                            <a href="#" class="text-accent hover:text-primary transition font-semibold">Terms of Service</a> 
                            and 
                            <a href="#" class="text-accent hover:text-primary transition font-semibold">Privacy Policy</a>
                        </label>
                    </div>

                    <!-- General Error Message -->
                    <div id="generalError" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                        <i class="fas fa-exclamation-circle mr-2"></i>
                        <span id="errorText"></span>
                    </div>

                    <!-- Submit Button -->
                    <button 
                        type="submit" 
                        class="w-full btn-accent py-3 mt-6 font-semibold flex items-center justify-center gap-2 hover:shadow-lg transition"
                    >
                        <span id="buttonText">Create Account</span>
                        <i class="fas fa-spinner fa-spin hidden" id="spinner"></i>
                    </button>
                </form>

                <!-- Sign In Link -->
                <p class="text-center text-gray-600 text-sm mt-6">
                    Already have an account? 
                    <a href="login.html" class="text-accent font-semibold hover:text-primary transition">
                        Sign in here
                    </a>
                </p>
            </div>

            <!-- Security Info -->
            <div class="mt-6 bg-green-50 border-l-4 border-accent p-4 rounded">
                <p class="text-sm text-gray-700">
                    <i class="fas fa-shield-alt text-accent mr-2"></i>
                    <strong>Your data is secure:</strong> All information is encrypted and never shared with third parties.
                </p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const form = document.getElementById('registerForm');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const generalError = document.getElementById('generalError');
        const errorText = document.getElementById('errorText');

        // Password Visibility Toggle
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const input = btn.previousElementSibling;
                const type = input.type === 'password' ? 'text' : 'password';
                input.type = type;
                btn.innerHTML = type === 'password' 
                    ? '<i class="fas fa-eye"></i>' 
                    : '<i class="fas fa-eye-slash"></i>';
            });
        });

        // Password Requirements Validation
        passwordInput.addEventListener('input', () => {
            const password = passwordInput.value;
            const hasLength = password.length >= 8;
            const hasUpper = /[A-Z]/.test(password);
            const hasNumber = /[0-9]/.test(password);

            updateRequirement('.req-length', hasLength);
            updateRequirement('.req-upper', hasUpper);
            updateRequirement('.req-number', hasNumber);
        });

        function updateRequirement(selector, met) {
            const el = document.querySelector(selector);
            if (met) {
                el.classList.remove('text-red-500', 'fa-times');
                el.classList.add('text-green-500', 'fa-check');
            } else {
                el.classList.remove('text-green-500', 'fa-check');
                el.classList.add('text-red-500', 'fa-times');
            }
        }

        // Form Submission
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            const termsAccepted = document.getElementById('terms').checked;

            generalError.classList.add('hidden');
            clearFieldErrors();

            // Client-side validation
            if (password !== confirmPassword) {
                showGeneralError('Passwords do not match');
                return;
            }

            if (!termsAccepted) {
                showGeneralError('Please accept the Terms of Service and Privacy Policy');
                return;
            }

            const auth = new AuthManager();
            auth.register({
                fullName,
                email,
                password,
                phone: document.getElementById('phone').value.trim() || null,
                meterNumber: document.getElementById('meterNumber').value.trim() || null
            })
                .then(user => {
                    console.log('Registration successful:', user);
                    window.location.href = 'dashboard.html';
                })
                .catch(error => {
                    console.error('Registration failed:', error);
                    showGeneralError(error.message);
                    highlightErrors(error.fields || []);
                });
        });

        function showGeneralError(message) {
            errorText.textContent = message;
            generalError.classList.remove('hidden');
            generalError.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function clearFieldErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.add('hidden');
            });
        }

        function highlightErrors(fields) {
            fields.forEach(field => {
                const input = document.getElementById(field);
                if (input) {
                    const errorMsg = input.nextElementSibling;
                    if (errorMsg && errorMsg.classList.contains('error-message')) {
                        errorMsg.classList.remove('hidden');
                    }
                }
            });
        }
    </script>
</body>
</html>
