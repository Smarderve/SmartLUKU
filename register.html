<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SmartLUKU</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1f5a3d 0%, #2d7d54 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .register-container {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
            padding: 2rem;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .logo h1 {
            font-size: 2rem;
            color: #1f5a3d;
            margin-bottom: 0.5rem;
        }
        
        .logo p {
            color: #6b7280;
            font-size: 0.875rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #111827;
        }
        
        .form-group.required label::after {
            content: ' *';
            color: #dc2626;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.875rem;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: all 0.2s;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #1f5a3d;
            box-shadow: 0 0 0 3px rgba(31, 90, 61, 0.1);
        }
        
        .btn-register {
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(135deg, #1f5a3d 0%, #2d7d54 100%);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1.5rem;
        }
        
        .btn-register:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .login-prompt {
            text-align: center;
            font-size: 0.875rem;
        }
        
        .login-prompt a {
            color: #1f5a3d;
            text-decoration: none;
            font-weight: 600;
        }
        
        .login-prompt a:hover {
            text-decoration: underline;
        }
        
        .terms {
            font-size: 0.75rem;
            color: #6b7280;
            margin-bottom: 1.5rem;
        }
        
        .terms a {
            color: #1f5a3d;
            text-decoration: none;
        }
        
        @media (max-width: 640px) {
            .register-container {
                padding: 1.5rem;
            }
            
            .logo h1 {
                font-size: 1.5rem;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <h1><i class="fas fa-lightning-bolt"></i> SmartLUKU</h1>
            <p>Create Your Account</p>
        </div>
        
        <form onsubmit="handleRegister(event)">
            <div class="form-group required">
                <label for="meter">Meter Number</label>
                <input type="text" id="meter" placeholder="TZ-2024-001234" required>
            </div>
            
            <div class="form-row">
                <div class="form-group required">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" placeholder="John" required>
                </div>
                <div class="form-group required">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" placeholder="Doe" required>
                </div>
            </div>
            
            <div class="form-group required">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="your@email.com" required>
            </div>
            
            <div class="form-group required">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="+255712345678" required>
            </div>
            
            <div class="form-group required">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 8 characters" required>
            </div>
            
            <div class="form-group required">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
            </div>
            
            <div class="form-group required">
                <label for="region">Region</label>
                <select id="region" required>
                    <option value="">Select Region</option>
                    <option value="dar">Dar es Salaam</option>
                    <option value="arusha">Arusha</option>
                    <option value="dodoma">Dodoma</option>
                    <option value="mbeya">Mbeya</option>
                    <option value="morogoro">Morogoro</option>
                </select>
            </div>
            
            <div class="terms">
                By registering, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
            </div>
            
            <button type="submit" class="btn-register">Create Account</button>
        </form>
        
        <div class="login-prompt">
            Already have an account? <a href="login.html">Sign in</a>
        </div>
    </div>
    
    <script>
        function handleRegister(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }
            
            if (password.length < 8) {
                alert('Password must be at least 8 characters');
                return;
            }
            
            localStorage.setItem('user', document.getElementById('meter').value);
            window.location.href = 'app.html';
        }
    </script>
</body>
</html>
