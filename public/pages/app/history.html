<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - SmartLUKU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../src/css/custom.css">
    <style>
        :root { --bg-primary: #ffffff; --bg-secondary: #f9fafb; --text-primary: #111827; --text-secondary: #4b5563; --green-dark: #1f5a3d; --green-main: #2a7f56; --yellow-main: #fbbf24; }
        [data-theme="dark"] { --bg-primary: #0f172a; --bg-secondary: #1e293b; --text-primary: #f1f5f9; --text-secondary: #cbd5e1; }
        body { background-color: var(--bg-secondary); display: flex; flex-direction: column; }
        .sidebar { position: fixed; left: 0; top: 0; width: 280px; height: 100vh; background: linear-gradient(180deg, var(--green-dark) 0%, var(--green-main) 100%); color: white; overflow-y: auto; z-index: 40; transition: transform 0.3s ease; }
        .sidebar.hidden { transform: translateX(-100%); }
        .main-content { margin-left: 280px; padding: 2rem; flex: 1; }
        .topbar { display: none; background-color: var(--bg-primary); padding: 1rem; border-bottom: 1px solid #e5e7eb; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 30; gap: 1rem; }
        .menu-icon { display: none; background: none; border: none; font-size: 1.5rem; cursor: pointer; }
        .logo-mobile { display: none; align-items: center; gap: 0.5rem; font-weight: bold; }
        .theme-toggle { background: none; border: none; cursor: pointer; font-size: 1.5rem; color: var(--text-primary); transition: all 0.3s; }
        .card { background-color: var(--bg-primary); border: 1px solid #e5e7eb; border-radius: 0.75rem; padding: 1.5rem; overflow-x: auto; }
        [data-theme="dark"] .card { border-color: #475569; }
        table { width: 100%; border-collapse: collapse; }
        th { background-color: var(--bg-secondary); padding: 1rem; text-align: left; font-weight: 600; color: var(--text-primary); border-bottom: 2px solid #e5e7eb; }
        [data-theme="dark"] th { border-color: #475569; }
        td { padding: 1rem; border-bottom: 1px solid #e5e7eb; }
        [data-theme="dark"] td { border-color: #475569; }
        tbody tr:hover { background-color: var(--bg-secondary); }
        @media (max-width: 768px) {
            .sidebar { width: 100%; bottom: 0; transform: translateY(100%); border-radius: 1rem 1rem 0 0; z-index: 50; }
            .sidebar.visible { transform: translateY(0); }
            .main-content { margin-left: 0; padding: 1rem; padding-bottom: 6rem; }
            .topbar { display: flex; }
            .menu-icon { display: block; }
            .logo-mobile { display: flex; }
        }
        .sidebar-header { padding: 1.5rem; border-bottom: 1px solid rgba(251, 191, 36, 0.2); }
        .sidebar-user { padding: 1rem 1.5rem; background-color: rgba(251, 191, 36, 0.1); }
        .sidebar-nav { padding: 1rem 0; }
        .sidebar-nav a { display: flex; align-items: center; gap: 0.75rem; padding: 1rem 1.5rem; color: rgba(255, 255, 255, 0.8); text-decoration: none; border-left: 3px solid transparent; }
        .sidebar-nav a.active { background-color: rgba(251, 191, 36, 0.15); border-left-color: var(--yellow-main); }
        .sidebar-logout { position: absolute; bottom: 0; width: 100%; padding: 1rem; border-top: 1px solid rgba(251, 191, 36, 0.2); }
        .btn-logout { width: 100%; background-color: rgba(239, 68, 68, 0.2); color: white; border: none; padding: 0.75rem; }
    </style>
</head>
<body>
    <div class="topbar">
        <button class="menu-icon" id="mobileMenuBtn"><i class="fas fa-bars"></i></button>
        <div class="logo-mobile"><i class="fas fa-bolt" style="color: var(--yellow-main);"></i><span>SmartLUKU</span></div>
        <button class="theme-toggle" id="themeToggleBtn" data-theme-icon><i class="fas fa-moon"></i></button>
    </div>

    <div class="sidebar hidden" id="sidebar">
        <div class="sidebar-header"><a href="../../index.html" style="color: white; text-decoration: none;"><i class="fas fa-bolt" style="color: var(--yellow-main);"></i></a></div>
        <div class="sidebar-user"><div style="width: 40px; height: 40px; background-color: var(--yellow-main); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--green-dark);" id="userInitial">D</div></div>
        <nav class="sidebar-nav">
            <a href="./dashboard.html"><i class="fas fa-home"></i><span>Dashboard</span></a>
            <a href="./payment.html"><i class="fas fa-credit-card"></i><span>Pay</span></a>
            <a href="./monitoring.html"><i class="fas fa-chart-line"></i><span>Monitor</span></a>
            <a href="./history.html" class="active"><i class="fas fa-history"></i><span>History</span></a>
            <a href="./analytics.html"><i class="fas fa-chart-bar"></i><span>Analytics</span></a>
            <a href="./settings.html"><i class="fas fa-cog"></i><span>Settings</span></a>
        </nav>
        <div class="sidebar-logout"><button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sign Out</button></div>
    </div>

    <main class="main-content">
        <div style="margin-bottom: 2rem;">
            <h1 style="margin: 0; font-size: 2rem;">Transaction History</h1>
            <p style="margin: 0.5rem 0 0 0; color: var(--text-secondary);">All payments and usage records</p>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Description</th>
                        <th style="text-align: right;">Amount (kWh)</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="transactionsList">
                    <tr><td colspan="5" style="text-align: center; padding: 2rem;"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="../../../src/js/core/utils.js"></script>
    <script src="../../../src/js/core/theme.js"></script>
    <script src="../../../src/js/core/auth.js"></script>
    <script src="../../../src/js/core/data.js"></script>
    <script>
        const authManager = new AuthManager();
        const dataManager = new DataManager();
        if (!authManager.isLoggedIn()) window.location.href = '../auth/login.html';
        const user = authManager.getCurrentUser();
        document.getElementById('userInitial').textContent = (user.fullName || 'U')[0].toUpperCase();

        const transactions = dataManager.getTransactions(user.meter);
        const tbody = document.getElementById('transactionsList');
        if (transactions.length > 0) {
            tbody.innerHTML = transactions.map(t => `
                <tr>
                    <td>${new Date(t.date).toLocaleDateString()}</td>
                    <td><span style="display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 600; background-color: ${t.type === 'payment' ? 'rgba(16, 185, 129, 0.1)' : 'rgba(59, 130, 246, 0.1)'}; color: ${t.type === 'payment' ? '#10b981' : '#3b82f6'};">${t.type === 'payment' ? 'Payment' : 'Usage'}</span></td>
                    <td>${t.description || '—'}</td>
                    <td style="text-align: right; font-weight: 600; color: ${t.type === 'payment' ? '#10b981' : '#ef4444'};">${t.type === 'payment' ? '+' : '-'}${t.amount}</td>
                    <td><span style="color: #10b981;">✓ Completed</span></td>
                </tr>
            `).join('');
        } else {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 2rem;">No transactions yet</td></tr>';
        }

        document.getElementById('themeToggleBtn')?.addEventListener('click', () => themeManager.toggle());
        const sidebar = document.getElementById('sidebar');
        document.getElementById('mobileMenuBtn')?.addEventListener('click', () => {
            sidebar.classList.toggle('hidden');
            sidebar.classList.toggle('visible');
        });
        function logout() { authManager.logout(); window.location.href = '../auth/login.html'; }
    </script>
</body>
</html>
