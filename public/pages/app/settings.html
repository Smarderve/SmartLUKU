<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - SmartLUKU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../src/css/custom.css">
    <style>
        :root { --bg-primary: #ffffff; --bg-secondary: #f9fafb; --text-primary: #111827; --text-secondary: #4b5563; --green-dark: #1f5a3d; --green-main: #2a7f56; --yellow-main: #fbbf24; }
        [data-theme="dark"] { --bg-primary: #0f172a; --bg-secondary: #1e293b; --text-primary: #f1f5f9; --text-secondary: #cbd5e1; }
        body { background-color: var(--bg-secondary); display: flex; flex-direction: column; }
        .sidebar { position: fixed; left: 0; top: 0; width: 280px; height: 100vh; background: linear-gradient(180deg, var(--green-dark) 0%, var(--green-main) 100%); color: white; overflow-y: auto; z-index: 40; }
        .sidebar.hidden { transform: translateX(-100%); }
        .main-content { margin-left: 280px; padding: 2rem; flex: 1; }
        .topbar { display: none; background-color: var(--bg-primary); padding: 1rem; }
        .menu-icon { display: none; }
        .logo-mobile { display: none; }
        .theme-toggle { background: none; border: none; cursor: pointer; font-size: 1.5rem; color: var(--text-primary); }
        .card { background-color: var(--bg-primary); border: 1px solid #e5e7eb; border-radius: 0.75rem; padding: 1.5rem; }
        [data-theme="dark"] .card { border-color: #475569; }
        .form-input { width: 100%; padding: 0.75rem 1rem; border: 1px solid #e5e7eb; border-radius: 0.5rem; background-color: var(--bg-secondary); color: var(--text-primary); font-size: 1rem; }
        [data-theme="dark"] .form-input { border-color: #475569; }
        .btn { padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 600; cursor: pointer; border: none; }
        .btn-primary { background: linear-gradient(135deg, var(--yellow-main) 0%, #f59e0b 100%); color: var(--green-dark); }
        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; bottom: 0; transform: translateY(100%); border-radius: 1rem 1rem 0 0; }
            .main-content { margin-left: 0; padding: 1rem; padding-bottom: 6rem; }
            .topbar { display: flex; }
            .menu-icon { display: block; }
            .logo-mobile { display: flex; }
            .settings-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="topbar"><button class="menu-icon" id="mobileMenuBtn"><i class="fas fa-bars"></i></button><div class="logo-mobile"><i class="fas fa-bolt" style="color: var(--yellow-main);"></i></div><button class="theme-toggle" id="themeToggleBtn" data-theme-icon><i class="fas fa-moon"></i></button></div>

    <div class="sidebar hidden" id="sidebar">
        <div style="padding: 1.5rem;"><a href="../../index.html" style="color: white;"><i class="fas fa-bolt" style="color: var(--yellow-main);"></i></a></div>
        <nav style="padding: 1rem 0;">
            <a href="./dashboard.html" style="display: flex; align-items: center; padding: 1rem 1.5rem; color: rgba(255,255,255,0.8);"><i class="fas fa-home"></i><span style="margin-left: 0.75rem;">Dashboard</span></a>
            <a href="./payment.html" style="display: flex; align-items: center; padding: 1rem 1.5rem; color: rgba(255,255,255,0.8);"><i class="fas fa-credit-card"></i><span style="margin-left: 0.75rem;">Pay</span></a>
            <a href="./monitoring.html" style="display: flex; align-items: center; padding: 1rem 1.5rem; color: rgba(255,255,255,0.8);"><i class="fas fa-chart-line"></i><span style="margin-left: 0.75rem;">Monitor</span></a>
            <a href="./history.html" style="display: flex; align-items: center; padding: 1rem 1.5rem; color: rgba(255,255,255,0.8);"><i class="fas fa-history"></i><span style="margin-left: 0.75rem;">History</span></a>
            <a href="./analytics.html" style="display: flex; align-items: center; padding: 1rem 1.5rem; color: rgba(255,255,255,0.8);"><i class="fas fa-chart-bar"></i><span style="margin-left: 0.75rem;">Analytics</span></a>
            <a href="./settings.html" class="active" style="display: flex; align-items: center; padding: 1rem 1.5rem; color: white; background-color: rgba(251,191,36,0.15); border-left: 3px solid var(--yellow-main);"><i class="fas fa-cog"></i><span style="margin-left: 0.75rem;">Settings</span></a>
        </nav>
        <div style="position: absolute; bottom: 0; width: 100%; padding: 1rem;"><button style="width: 100%; background-color: rgba(239,68,68,0.2); color: white; border: none; padding: 0.75rem; cursor: pointer;" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sign Out</button></div>
    </div>

    <main class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap;">
            <div><h1 style="margin: 0; font-size: 2rem;">Settings</h1><p style="margin: 0.5rem 0 0 0; color: var(--text-secondary);">Manage preferences</p></div>
            <button class="theme-toggle" id="themeToggle" data-theme-icon><i class="fas fa-moon"></i></button>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; settings-grid;">
            <!-- Settings Menu -->
            <div class="card">
                <h3 style="margin-top: 0;">Settings</h3>
                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <button onclick="showSection('profile')" style="text-align: left; padding: 0.75rem; border: none; background: none; cursor: pointer; color: var(--text-secondary); font-weight: 600;"><i class="fas fa-user" style="margin-right: 0.5rem;"></i> Profile</button>
                    <button onclick="showSection('theme')" style="text-align: left; padding: 0.75rem; border: none; background: none; cursor: pointer; color: var(--text-secondary); font-weight: 600;"><i class="fas fa-palette" style="margin-right: 0.5rem;"></i> Appearance</button>
                    <button onclick="showSection('notifications')" style="text-align: left; padding: 0.75rem; border: none; background: none; cursor: pointer; color: var(--text-secondary); font-weight: 600;"><i class="fas fa-bell" style="margin-right: 0.5rem;"></i> Notifications</button>
                    <button onclick="showSection('security')" style="text-align: left; padding: 0.75rem; border: none; background: none; cursor: pointer; color: var(--text-secondary); font-weight: 600;"><i class="fas fa-lock" style="margin-right: 0.5rem;"></i> Security</button>
                </div>
            </div>

            <!-- Content -->
            <div>
                <!-- Profile -->
                <div id="profile" class="card">
                    <h3 style="margin-top: 0;">Profile Information</h3>
                    <div style="display: flex; flex-direction: column; gap: 1rem;">
                        <div>
                            <label style="display: block; color: var(--text-primary); font-weight: 600; margin-bottom: 0.5rem;">Full Name</label>
                            <input type="text" id="fullName" placeholder="Your name" class="form-input">
                        </div>
                        <div>
                            <label style="display: block; color: var(--text-primary); font-weight: 600; margin-bottom: 0.5rem;">Email</label>
                            <input type="email" placeholder="your@email.com" class="form-input">
                        </div>
                        <div>
                            <label style="display: block; color: var(--text-primary); font-weight: 600; margin-bottom: 0.5rem;">Meter Number</label>
                            <input type="text" id="meter" disabled class="form-input" style="opacity: 0.6; cursor: not-allowed;">
                        </div>
                        <button class="btn btn-primary">Save Changes</button>
                    </div>
                </div>

                <!-- Theme -->
                <div id="theme" class="card hidden">
                    <h3 style="margin-top: 0;">Appearance Settings</h3>
                    <div style="display: flex; flex-direction: column; gap: 1rem;">
                        <div style="display: flex; align-items: center; justify-content: space-between; padding: 1rem; background-color: var(--bg-secondary); border-radius: 0.5rem;">
                            <div>
                                <p style="margin: 0; color: var(--text-primary); font-weight: 600;">Dark Mode</p>
                                <p style="margin: 0.25rem 0 0 0; font-size: 0.875rem; color: var(--text-secondary);">Toggle dark/light theme</p>
                            </div>
                            <button id="themeToggleSwitch" onclick="toggleTheme()" style="width: 50px; height: 28px; background-color: var(--green-main); border: none; border-radius: 9999px; cursor: pointer; position: relative; transition: all 0.3s;">
                                <div id="themeToggleCircle" style="position: absolute; width: 24px; height: 24px; background-color: white; border-radius: 50%; top: 2px; left: 2px; transition: all 0.3s;"></div>
                            </button>
                        </div>
                        <p style="font-size: 0.875rem; color: var(--text-secondary);">Your preference will be saved automatically</p>
                    </div>
                </div>

                <!-- Notifications -->
                <div id="notifications" class="card hidden">
                    <h3 style="margin-top: 0;">Notifications</h3>
                    <div style="display: flex; flex-direction: column; gap: 1rem;">
                        <label style="display: flex; align-items: center; gap: 0.75rem; padding: 1rem; background-color: var(--bg-secondary); border-radius: 0.5rem; cursor: pointer;">
                            <input type="checkbox" checked>
                            <div><p style="margin: 0; color: var(--text-primary); font-weight: 600;">Low Balance Alerts</p><p style="margin: 0.25rem 0 0 0; font-size: 0.875rem; color: var(--text-secondary);">When balance below 10 kWh</p></div>
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.75rem; padding: 1rem; background-color: var(--bg-secondary); border-radius: 0.5rem; cursor: pointer;">
                            <input type="checkbox" checked>
                            <div><p style="margin: 0; color: var(--text-primary); font-weight: 600;">Payment Reminders</p><p style="margin: 0.25rem 0 0 0; font-size: 0.875rem; color: var(--text-secondary);">Bill due notifications</p></div>
                        </label>
                    </div>
                </div>

                <!-- Security -->
                <div id="security" class="card hidden">
                    <h3 style="margin-top: 0;">Security Settings</h3>
                    <div style="display: flex; flex-direction: column; gap: 1rem;">
                        <div>
                            <label style="display: block; color: var(--text-primary); font-weight: 600; margin-bottom: 0.5rem;">Current Password</label>
                            <input type="password" placeholder="Enter current password" class="form-input">
                        </div>
                        <div>
                            <label style="display: block; color: var(--text-primary); font-weight: 600; margin-bottom: 0.5rem;">New Password</label>
                            <input type="password" placeholder="Enter new password" class="form-input">
                        </div>
                        <div>
                            <label style="display: block; color: var(--text-primary); font-weight: 600; margin-bottom: 0.5rem;">Confirm Password</label>
                            <input type="password" placeholder="Confirm new password" class="form-input">
                        </div>
                        <button class="btn btn-primary">Change Password</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../../../src/js/core/utils.js"></script>
    <script src="../../../src/js/core/theme.js"></script>
    <script src="../../../src/js/core/auth.js"></script>
    <script src="../../../src/js/core/data.js"></script>
    <script>
        const authManager = new AuthManager();
        const dataManager = new DataManager();
        if (!authManager.isLoggedIn()) window.location.href = '../auth/login.html';

        const user = authManager.getCurrentUser();
        document.getElementById('fullName').value = user.fullName || '';
        document.getElementById('meter').value = user.meter;

        function showSection(section) {
            ['profile', 'theme', 'notifications', 'security'].forEach(s => {
                const el = document.getElementById(s);
                if (el) el.classList.toggle('hidden', s !== section);
            });
        }

        function toggleTheme() {
            themeManager.toggle();
            updateThemeSwitch();
        }

        function updateThemeSwitch() {
            const circle = document.getElementById('themeToggleCircle');
            if (themeManager.getTheme() === 'dark') {
                circle.style.left = '24px';
            } else {
                circle.style.left = '2px';
            }
        }

        updateThemeSwitch();

        document.getElementById('themeToggle')?.addEventListener('click', () => {
            themeManager.toggle();
            updateThemeSwitch();
        });

        document.getElementById('themeToggleBtn')?.addEventListener('click', () => {
            themeManager.toggle();
            updateThemeSwitch();
        });

        const sidebar = document.getElementById('sidebar');
        document.getElementById('mobileMenuBtn')?.addEventListener('click', () => {
            sidebar.classList.toggle('hidden');
            sidebar.classList.toggle('visible');
        });

        function logout() { authManager.logout(); window.location.href = '../auth/login.html'; }
    </script>
</body>
</html>
