<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - SmartLUKU</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../src/css/custom.css">
    
    <style>
        .green-dark { background: linear-gradient(135deg, #1f5a3d 0%, #2a7f56 100%); }
        .yellow-btn { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); }
        .yellow-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(251, 191, 36, 0.3); }
    </style>
</head>
<body class="bg-gray-900">
    <!-- Navigation -->
    <nav class="bg-gradient-to-r from-green-800 to-green-700 border-b-2 border-yellow-400 py-3">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <a href="../../index.html" class="flex items-center gap-2 hover:opacity-80 transition">
                <i class="fas fa-bolt text-yellow-400 text-2xl"></i>
                <span class="text-xl font-bold text-white">SmartLUKU</span>
            </a>
            <a href="../../index.html" class="text-gray-300 hover:text-yellow-300 transition">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="min-h-screen flex items-center justify-center py-12">
        <div class="w-full max-w-md">
            <!-- Card -->
            <div class="bg-gray-800 border border-gray-700 rounded-xl shadow-2xl p-8">
                <h1 class="text-3xl font-bold text-white mb-2 text-center">Welcome Back</h1>
                <p class="text-gray-400 text-center mb-8">Manage your electricity account</p>

                <!-- Login Form -->
                <form id="loginForm" class="space-y-6">
                    <!-- Login Type Toggle -->
                    <div class="flex gap-4 p-2 bg-gray-700 rounded-lg">
                        <label class="flex-1 text-center py-2 cursor-pointer">
                            <input type="radio" name="loginType" value="meter" checked class="hidden">
                            <span id="meterTab" class="block px-4 py-1 bg-green-600 text-white rounded font-semibold">Meter No.</span>
                        </label>
                        <label class="flex-1 text-center py-2 cursor-pointer">
                            <input type="radio" name="loginType" value="email" class="hidden">
                            <span id="emailTab" class="block px-4 py-1 bg-transparent text-gray-400 rounded font-semibold">Email</span>
                        </label>
                    </div>

                    <!-- Meter Input -->
                    <div id="meterDiv">
                        <label class="block text-gray-300 text-sm font-semibold mb-2">Meter Number</label>
                        <input type="text" id="meter" placeholder="Enter your 10-digit meter number" 
                               class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:border-yellow-400 focus:outline-none">
                    </div>

                    <!-- Email Input -->
                    <div id="emailDiv" class="hidden">
                        <label class="block text-gray-300 text-sm font-semibold mb-2">Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email"
                               class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:border-yellow-400 focus:outline-none">
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block text-gray-300 text-sm font-semibold mb-2">Password</label>
                        <input type="password" id="password" placeholder="Enter your password"
                               class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:border-yellow-400 focus:outline-none">
                    </div>

                    <!-- Remember Me -->
                    <div class="flex items-center">
                        <input type="checkbox" id="remember" class="w-4 h-4 rounded bg-gray-700 border-gray-600 cursor-pointer">
                        <label for="remember" class="ml-2 text-sm text-gray-400">Remember me</label>
                    </div>

                    <!-- Sign In Button -->
                    <button type="submit" class="w-full yellow-btn py-3 rounded-lg text-gray-900 font-bold text-lg transition">
                        Sign In
                    </button>

                    <!-- Demo Account Info -->
                    <div class="bg-green-900 bg-opacity-30 border border-green-700 rounded-lg p-4 text-sm">
                        <p class="text-gray-300"><span class="font-semibold text-yellow-400">Demo Account:</span></p>
                        <p class="text-gray-400">Meter: <span class="font-mono text-yellow-300">1234567890</span></p>
                        <p class="text-gray-400">Password: <span class="font-mono text-yellow-300">Demo@123</span></p>
                    </div>

                    <!-- Create Account Link -->
                    <div class="text-center">
                        <p class="text-gray-400">Don't have an account? <a href="./register.html" class="text-yellow-400 font-semibold hover:text-yellow-300">Create one</a></p>
                    </div>
                </form>
            </div>

            <!-- Features Badge -->
            <div class="mt-8 grid grid-cols-3 gap-4 text-center">
                <div class="text-gray-400">
                    <i class="fas fa-lock text-yellow-400 text-2xl mb-2"></i>
                    <p class="text-xs">Secure Login</p>
                </div>
                <div class="text-gray-400">
                    <i class="fas fa-clock text-yellow-400 text-2xl mb-2"></i>
                    <p class="text-xs">24/7 Access</p>
                </div>
                <div class="text-gray-400">
                    <i class="fas fa-shield-alt text-yellow-400 text-2xl mb-2"></i>
                    <p class="text-xs">Your Data Safe</p>
                </div>
            </div>
        </div>
    </div>

    <script src="../../src/js/core/utils.js"></script>
    <script src="../../src/js/core/auth.js"></script>
    <script>
        // Toggle between meter and email login
        document.querySelectorAll('input[name="loginType"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                const meterDiv = document.getElementById('meterDiv');
                const emailDiv = document.getElementById('emailDiv');
                const meterTab = document.getElementById('meterTab');
                const emailTab = document.getElementById('emailTab');
                
                if (e.target.value === 'meter') {
                    meterDiv.classList.remove('hidden');
                    emailDiv.classList.add('hidden');
                    meterTab.classList.add('bg-green-600');
                    meterTab.classList.remove('bg-transparent');
                    emailTab.classList.remove('bg-green-600');
                    emailTab.classList.add('bg-transparent');
                } else {
                    meterDiv.classList.add('hidden');
                    emailDiv.classList.remove('hidden');
                    meterTab.classList.remove('bg-green-600');
                    meterTab.classList.add('bg-transparent');
                    emailTab.classList.add('bg-green-600');
                    emailTab.classList.remove('bg-transparent');
                }
            });
        });

        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const loginType = document.querySelector('input[name="loginType"]:checked').value;
            const password = document.getElementById('password').value;
            let identifier;

            if (loginType === 'meter') {
                identifier = document.getElementById('meter').value;
            } else {
                identifier = document.getElementById('email').value;
            }

            try {
                const authManager = new AuthManager();
                authManager.login(identifier, password, loginType);
                window.location.href = '../app/dashboard.html';
            } catch (error) {
                new Notification('Error', error.message, 'error');
            }
        });
    </script>
</body>
</html>
