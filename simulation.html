<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLUKU - IoT Simulation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #1f5a3d;
            --accent: #fbbf24;
            --secondary: #10b981;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --text-light: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
        }
        html[data-theme="light"] {
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text: #111827;
            --text-light: #6b7280;
            --border: #e5e7eb;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.5rem;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 1.2rem; font-weight: 700; color: var(--primary); }
        .logo i { color: var(--accent); margin-right: 0.4rem; }
        .top-actions { display: flex; gap: 0.75rem; align-items: center; }
        .live-badge {
            display: flex; align-items: center; gap: 0.4rem;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 0.35rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .live-dot {
            width: 8px; height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
            text-decoration: none;
            color: inherit;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(16,185,129,0.3); }
        .btn-secondary {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-icon {
            background: none;
            border: 1px solid var(--border);
            padding: 0.45rem 0.6rem;
            border-radius: 0.5rem;
            cursor: pointer;
            color: var(--text);
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            height: calc(100vh - 56px);
        }
        @media (max-width: 1100px) {
            .layout { grid-template-columns: 1fr; height: auto; }
        }

        .main-column {
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }
        @media (max-width: 1100px) {
            .main-column { min-height: 600px; }
        }

        .scene-panel {
            position: relative;
            background: #0a0f1a;
            flex: 1.1;
            min-height: 280px;
        }

        .circuit-panel {
            flex: 0.85;
            min-height: 200px;
            max-height: 280px;
            background: var(--card-bg);
            border-top: 2px solid var(--accent);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .circuit-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;
        }
        .circuit-header h3 {
            font-size: 0.8rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .circuit-sync-badge {
            font-size: 0.7rem;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .circuit-canvas-wrap {
            flex: 1;
            padding: 0.25rem 0.5rem;
            overflow: hidden;
        }
        .circuit-canvas-wrap svg {
            width: 100%;
            height: 100%;
            min-height: 140px;
        }
        .circuit-stats {
            display: flex;
            gap: 1rem;
            padding: 0.4rem 1rem;
            font-size: 0.7rem;
            color: var(--text-light);
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .circuit-stats span { display: flex; align-items: center; gap: 0.3rem; }
        #circuitSelectedLabel { color: var(--accent); margin-left: auto; }

        .circuit-node { cursor: pointer; }
        .circuit-node-bg {
            fill: var(--bg);
            stroke: var(--border);
            stroke-width: 1.5;
            transition: all 0.2s;
        }
        .circuit-node:hover .circuit-node-bg { stroke: var(--secondary); }
        .circuit-node.live .circuit-node-bg {
            stroke: var(--secondary);
            fill: rgba(16, 185, 129, 0.12);
        }
        .circuit-node.selected .circuit-node-bg {
            stroke: var(--accent);
            stroke-width: 2.5;
            fill: rgba(251, 191, 36, 0.15);
            filter: url(#glow);
        }
        .circuit-node-icon { font-size: 14px; fill: var(--text); pointer-events: none; }
        .circuit-node-label { font-size: 8px; fill: var(--text-light); pointer-events: none; }
        .circuit-node-power { font-size: 7px; fill: var(--accent); font-weight: 700; pointer-events: none; }
        .branch-dot { fill: var(--secondary); }
        #canvas3d {
            width: 100%;
            height: 100%;
            display: block;
        }
        .scene-overlay {
            position: absolute;
            top: 1rem;
            left: 1rem;
            right: 1rem;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        .scene-info {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: 0.6rem;
            padding: 0.75rem 1rem;
            pointer-events: auto;
        }
        .scene-info h3 { font-size: 0.75rem; color: var(--text-light); text-transform: uppercase; margin-bottom: 0.25rem; }
        .scene-info .val { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
        .scene-controls {
            display: flex;
            gap: 0.5rem;
            pointer-events: auto;
        }
        .scene-hint {
            position: absolute;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.8);
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            color: var(--text-light);
            pointer-events: none;
        }

        .side-panel {
            overflow-y: auto;
            padding: 1rem;
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        @media (max-width: 1100px) {
            .side-panel { border-left: none; border-top: 1px solid var(--border); max-height: none; }
        }

        .panel-section {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.6rem;
            padding: 1rem;
        }
        .panel-section h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-light);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .meter-display {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-radius: 0.6rem;
            padding: 1rem;
            text-align: center;
            margin-bottom: 0.75rem;
        }
        .meter-display .balance { font-size: 2rem; font-weight: 700; }
        .meter-display .meta { font-size: 0.75rem; opacity: 0.85; margin-top: 0.25rem; }

        .sensor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }
        .sensor-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.6rem;
        }
        .sensor-card .label { font-size: 0.7rem; color: var(--text-light); }
        .sensor-card .reading { font-size: 1.1rem; font-weight: 700; color: var(--secondary); }
        .sensor-card .type { font-size: 0.65rem; color: var(--text-light); margin-top: 0.15rem; }
        .sensor-card.warning .reading { color: var(--warning); }
        .sensor-card.danger .reading { color: var(--error); }

        .appliance-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .appliance-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .appliance-item:hover { border-color: var(--secondary); }
        .appliance-item.active { border-color: var(--accent); background: rgba(251, 191, 36, 0.08); }
        .appliance-icon {
            width: 36px; height: 36px;
            border-radius: 0.5rem;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem;
            color: white;
        }
        .appliance-info { flex: 1; }
        .appliance-info .name { font-size: 0.85rem; font-weight: 600; }
        .appliance-info .power { font-size: 0.75rem; color: var(--text-light); }
        .toggle-switch {
            width: 44px; height: 24px;
            background: var(--border);
            border-radius: 12px;
            position: relative;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .toggle-switch.on { background: var(--secondary); }
        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 18px; height: 18px;
            background: white;
            border-radius: 50%;
            top: 3px; left: 3px;
            transition: transform 0.2s;
        }
        .toggle-switch.on::after { transform: translateX(20px); }

        .iot-device-list { display: flex; flex-direction: column; gap: 0.4rem; }
        .iot-device {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.5rem;
            font-size: 0.8rem;
            border-bottom: 1px solid var(--border);
        }
        .iot-device:last-child { border-bottom: none; }
        .iot-status {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--success);
            flex-shrink: 0;
        }
        .iot-status.offline { background: var(--error); }

        .alert-item {
            padding: 0.6rem;
            border-radius: 0.4rem;
            font-size: 0.8rem;
            margin-bottom: 0.4rem;
            display: flex;
            gap: 0.5rem;
            align-items: flex-start;
        }
        .alert-item.warning { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .alert-item.danger { background: rgba(239, 68, 68, 0.15); color: var(--error); }
        .alert-item.info { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }

        .flow-diagram {
            padding: 0.5rem 0;
        }
        .flow-svg {
            width: 100%;
            height: auto;
            display: block;
        }
        .flow-path-bg {
            fill: none;
            stroke: var(--border);
            stroke-width: 3;
            stroke-linecap: round;
        }
        .flow-path-live {
            fill: none;
            stroke: var(--accent);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 8 12;
            animation: flowDash 0.6s linear infinite;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .flow-path-live.on { opacity: 1; }
        .flow-path-branch {
            fill: none;
            stroke: var(--secondary);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-dasharray: 6 10;
            animation: flowDash 0.5s linear infinite;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .flow-path-branch.on { opacity: 1; }
        @keyframes flowDash {
            to { stroke-dashoffset: -20; }
        }
        body.sim-paused .flow-path-live,
        body.sim-paused .flow-path-branch,
        body.sim-paused .power-path-step.live .step-arrow,
        body.sim-paused .pulse {
            animation-play-state: paused;
        }
        .flow-label {
            font-size: 9px;
            fill: var(--text-light);
            font-family: inherit;
        }
        .flow-label.active { fill: var(--accent); font-weight: 700; }
        .flow-dot {
            fill: var(--accent);
            filter: drop-shadow(0 0 4px var(--accent));
        }
        .power-path-list {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            margin-top: 0.5rem;
        }
        .power-path-step {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            padding: 0.35rem 0.5rem;
            border-radius: 0.35rem;
            background: var(--bg);
            border: 1px solid var(--border);
        }
        .power-path-step.live {
            border-color: var(--accent);
            background: rgba(251, 191, 36, 0.08);
        }
        .power-path-step .step-icon {
            width: 22px;
            text-align: center;
            color: var(--text-light);
        }
        .power-path-step.live .step-icon { color: var(--accent); }
        .power-path-step .step-arrow {
            margin-left: auto;
            color: var(--secondary);
            font-size: 0.65rem;
            opacity: 0;
        }
        .power-path-step.live .step-arrow { opacity: 1; animation: flowDash 0.6s linear infinite; }
        .scene-hint { max-width: 90%; text-align: center; }
        .view-tabs {
            display: flex;
            gap: 0.25rem;
            pointer-events: auto;
        }
        .view-tab {
            padding: 0.35rem 0.65rem;
            font-size: 0.7rem;
            border-radius: 0.35rem;
            border: 1px solid var(--border);
            background: rgba(15,23,42,0.8);
            color: var(--text-light);
            cursor: pointer;
        }
        .view-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(251,191,36,0.1); }
        .highlight-ring-3d { /* applied via three.js */ }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="logo"><i class="fas fa-bolt"></i> SmartLUKU IoT Simulation</div>
        <div class="top-actions">
            <div class="live-badge"><span class="live-dot"></span> LIVE SIMULATION</div>
            <button class="btn-icon" id="themeBtn" title="Toggle theme"><i class="fas fa-sun"></i></button>
            <a href="app.html" class="btn btn-primary"><i class="fas fa-chart-line"></i> Dashboard</a>
        </div>
    </header>

    <div class="layout">
        <div class="main-column">
            <div class="scene-panel" id="scenePanel">
                <canvas id="canvas3d"></canvas>
                <div class="scene-overlay">
                    <div class="scene-info">
                        <h3>Total Load</h3>
                        <div class="val" id="overlayPower">0.00 kW</div>
                    </div>
                    <div class="scene-controls">
                        <div class="view-tabs">
                            <button class="view-tab active" id="tabBoth" title="3D + Circuit">3D + Circuit</button>
                            <button class="view-tab" id="tab3d" title="3D only">3D Only</button>
                        </div>
                        <button class="btn btn-secondary" id="resetCamBtn"><i class="fas fa-compress"></i> Reset</button>
                        <button class="btn btn-secondary" id="toggleSimBtn"><i class="fas fa-pause"></i> Pause</button>
                    </div>
                </div>
                <div class="scene-hint"><i class="fas fa-link"></i> 3D &amp; circuit synced &middot; Click nodes in either view &middot; Drag to rotate</div>
            </div>

            <div class="circuit-panel" id="circuitPanel">
                <div class="circuit-header">
                    <h3><i class="fas fa-project-diagram"></i> Live Circuit Flow</h3>
                    <span class="circuit-sync-badge"><i class="fas fa-link"></i> Synced with 3D</span>
                </div>
                <div class="circuit-canvas-wrap">
                    <svg class="flow-svg" id="flowSvg"></svg>
                </div>
                <div class="circuit-stats" id="circuitStats"></div>
            </div>
        </div>

        <aside class="side-panel">
            <div class="panel-section">
                <div class="meter-display">
                    <div style="font-size:0.75rem;opacity:0.9">TANESCO LUKU Prepaid Meter</div>
                    <div class="balance" id="meterBalance">285.0 kWh</div>
                    <div class="meta">Meter: <span id="meterId">—</span> &middot; <span id="meterStatus">Connected</span></div>
                </div>
                <div class="power-path-list" id="powerPathList"></div>
            </div>

            <div class="panel-section">
                <h2><i class="fas fa-microchip"></i> Live Sensors</h2>
                <div class="sensor-grid" id="sensorGrid"></div>
            </div>

            <div class="panel-section">
                <h2><i class="fas fa-plug"></i> Appliances</h2>
                <div class="appliance-list" id="applianceList"></div>
            </div>

            <div class="panel-section">
                <h2><i class="fas fa-wifi"></i> IoT Devices</h2>
                <div class="iot-device-list" id="iotDeviceList"></div>
            </div>

            <div class="panel-section">
                <h2><i class="fas fa-bell"></i> Alerts</h2>
                <div id="alertsContainer"></div>
            </div>
        </aside>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="src/js/simulation-engine.js"></script>
    <script src="src/js/circuit-schematic.js"></script>
    <script src="src/js/config.js"></script>
    <script src="src/js/modules/sms-alerts.js"></script>
    <script>
    (function () {
        // ─── 3D ↔ Circuit integration refs ───
        let focusCameraOn = () => {};
        let highlight3DNode = () => {};
        // ─── Theme ───
        const savedTheme = localStorage.getItem('smartluku-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeBtn').addEventListener('click', () => {
            const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('smartluku-theme', next);
            updateSceneTheme();
        });

        // ─── Three.js Scene ───
        const canvas = document.getElementById('canvas3d');
        const panel = document.getElementById('scenePanel');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f1b2e);
        scene.fog = new THREE.Fog(0x0f1b2e, 26, 60);

        const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
        camera.position.set(6, 5, 8);

        const controls = new THREE.OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.set(0, 1.4, 0);
        controls.maxPolarAngle = Math.PI / 2.05;

        // ─── Procedural textures (tiles, paint, ceiling) ───
        function makeCanvasTexture(drawFn, w, h) {
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            drawFn(c.getContext('2d'), w, h);
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        const floorTileTex = makeCanvasTexture((ctx, size) => {
            const tile = 64, grout = '#b8b0a4';
            const shades = ['#ebe6dc', '#e0dbd1', '#d6d0c6', '#ece7dd'];
            ctx.fillStyle = grout;
            ctx.fillRect(0, 0, size, size);
            for (let r = 0; r < size / tile; r++) {
                for (let c = 0; c < size / tile; c++) {
                    const pad = 4;
                    const x = c * tile + pad, y = r * tile + pad, s = tile - pad * 2;
                    ctx.fillStyle = shades[(r + c) % shades.length];
                    ctx.fillRect(x, y, s, s);
                    const g = ctx.createLinearGradient(x, y, x + s, y + s);
                    g.addColorStop(0, 'rgba(255,255,255,0.22)');
                    g.addColorStop(0.5, 'rgba(255,255,255,0)');
                    g.addColorStop(1, 'rgba(0,0,0,0.06)');
                    ctx.fillStyle = g;
                    ctx.fillRect(x, y, s, s);
                }
            }
        }, 512, 512);
        floorTileTex.repeat.set(5, 4);

        const wallPaintTex = makeCanvasTexture((ctx, w, h) => {
            ctx.fillStyle = '#f5f0e6';
            ctx.fillRect(0, 0, w, h);
            for (let i = 0; i < 8000; i++) {
                const x = Math.random() * w, y = Math.random() * h;
                const a = Math.random() * 0.04;
                ctx.fillStyle = Math.random() > 0.5 ? `rgba(255,255,255,${a})` : `rgba(0,0,0,${a * 0.5})`;
                ctx.fillRect(x, y, 1, 1);
            }
        }, 256, 256);
        wallPaintTex.repeat.set(3, 2);

        const ceilingTex = makeCanvasTexture((ctx, w, h) => {
            ctx.fillStyle = '#faf8f4';
            ctx.fillRect(0, 0, w, h);
            for (let i = 0; i < 3000; i++) {
                ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.02})`;
                ctx.fillRect(Math.random() * w, Math.random() * h, 2, 1);
            }
        }, 256, 256);
        ceilingTex.repeat.set(4, 3);

        const floorMat = new THREE.MeshStandardMaterial({ map: floorTileTex, roughness: 0.35, metalness: 0.05 });
        // Glass-house walls: translucent so the electric supply (meter, board, wires, flow) is always visible
        const wallMat = new THREE.MeshStandardMaterial({
            color: 0x35506f, roughness: 0.85, metalness: 0.1,
            transparent: true, opacity: 0.16, depthWrite: false, side: THREE.DoubleSide
        });
        const ceilingMat = new THREE.MeshStandardMaterial({
            color: 0x2a4055, roughness: 0.95,
            transparent: true, opacity: 0.1, depthWrite: false, side: THREE.DoubleSide
        });

        function addWindow(cx, cy, cz, rotY, ww, wh) {

            const frameW = 0.07;

            left.position.x = -ww / 2 - frameW / 2;
            const right = new THREE.Mesh(new THREE.BoxGeometry(frameW, wh, 0.1), frameMat);
            right.position.x = ww / 2 + frameW / 2;
            const mullion = new THREE.Mesh(new THREE.BoxGeometry(frameW * 0.6, wh, 0.08), frameMat);
            const glassL = new THREE.Mesh(new THREE.BoxGeometry(ww / 2 - 0.02, wh - 0.04, 0.04), glassMat);
            glassL.position.x = -ww / 4;

            glassR.position.x = ww / 4;
            const sill = new THREE.Mesh(new THREE.BoxGeometry(ww + 0.2, 0.06, 0.18), new THREE.MeshStandardMaterial({ color: 0x9a8b78 }));
            sill.position.y = -wh / 2 - 0.1;
            [top, bot, left, right, mullion, glassL, glassR, sill].forEach(p => { p.castShadow = true; grp.add(p); });
            homeGroup.add(grp);

        // Door
        const doorGroup = new THREE.Group();
        doorGroup.position.set(0, 1.05, ROOM_D / 2 - 0.02);
        const doorPanel = new THREE.Mesh(new THREE.BoxGeometry(1.0, 2.1, 0.08), doorMat);
        const doorHandle = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), new THREE.MeshStandardMaterial({ color: 0xc9a227, metalness: 0.8 }));

        const doorFrameL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.25, 0.12), frameMat);
        doorFrameL.position.set(-0.55, 0, 0);
        const doorFrameR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.25, 0.12), frameMat);
        doorFrameR.position.set(0.55, 0, 0);
        const doorFrameT = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.1, 0.12), frameMat);
        doorFrameT.position.set(0, 1.15, 0);
        [doorPanel, doorHandle, doorFrameL, doorFrameR, doorFrameT].forEach(m => { m.castShadow = true; doorGroup.add(m); });
        homeGroup.add(doorGroup);

        // Windows
        addWindow(-ROOM_W / 2 + 0.12, 1.65, -0.5, Math.PI / 2, 1.6, 1.35);
        addWindow(ROOM_W / 2 - 0.12, 1.7, -0.25, -Math.PI / 2, 2.2, 1.5);
        addWindow(-0.35, 2.0, -ROOM_D / 2 + 0.12, 0, 1.4, 1.0);

        // Exterior ground (visible through windows)

        scene.add(yard);

        // Exterior building facade hint (outside back wall)
        const extWall = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W + 1, ROOM_H + 0.5, 0.3), exteriorMat);
        extWall.position.set(0, ROOM_H / 2, -ROOM_D / 2 - 0.35);

        scene.add(extWall);

        // Area rug for living space
        const rug = new THREE.Mesh(

        // Lighting — daylight through windows + warm interior

        const ambient = new THREE.AmbientLight(0xdfeaff, 0.5);

        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 40;
        sun.shadow.camera.left = -10;
        sun.shadow.camera.right = 10;
        sun.shadow.camera.top = 10;
        sun.shadow.camera.bottom = -10;
        scene.add(sun);
        const windowLight = new THREE.DirectionalLight(0xc8e4ff, 0.45);
        windowLight.position.set(-8, 4, 2);
        scene.add(windowLight);
        const interiorCeilingLight = new THREE.PointLight(0xfff5e0, 0, 14);
        interiorCeilingLight.position.set(0, ROOM_H - 0.3, 0);
        scene.add(interiorCeilingLight);

        // ─── Power network nodes ───
        const NODES = {
            grid:     new THREE.Vector3(-7.2, 3.8, -4.5),
            meter:    new THREE.Vector3(-5.5, 1.5, -4.88),
            distBoard:new THREE.Vector3(-4.6, 1.3, -4.2),
            junction: new THREE.Vector3(-2.2, 0.18, -1.8),
            hub:      new THREE.Vector3(-3.8, 0.35, -4.2)
        };

        const sceneNodes = {};

        // TANESCO grid pole & transformer (outside house)
        const gridGroup = new THREE.Group();

        const pole = new THREE.Mesh(
            new THREE.CylinderGeometry(0.06, 0.08, 3.5, 8),

        gridGroup.add(pole);
        const transformer = new THREE.Mesh(

        meterBody.castShadow = true;

        const meterScreen = new THREE.Mesh(

        function addLabel(parent, text, yOffset) {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 48;
            const cx = c.getContext('2d');
            cx.fillStyle = 'rgba(15,23,42,0.9)';
            cx.fillRect(0, 0, 256, 48);
            cx.fillStyle = '#fbbf24';
            cx.font = 'bold 18px sans-serif';
            cx.textAlign = 'center';
            cx.fillText(text, 128, 30);
            const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
            spr.position.y = yOffset;
            spr.scale.set(1.2, 0.25, 1);
            parent.add(spr);
        }

        // Appliance 3D objects map
        const applianceMeshes = {};
        const applianceDefs = SimulationEngine.getApplianceDefs();

        function createApplianceMesh(def) {
            const group = new THREE.Group();
            group.position.set(def.position.x, def.position.y, def.position.z);
            group.userData = { id: def.id };

            let body;
            if (def.id === 'ac') {
                body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.5, 0.4), new THREE.MeshStandardMaterial({ color: def.color }));
                body.position.y = 0;
            } else if (def.id === 'lights') {
                const plate = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.04, 16), new THREE.MeshStandardMaterial({ color: 0xe8e4dc, metalness: 0.3 }));
                plate.position.y = 0.35;
                group.add(plate);
                const shade = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.35, 0.22, 16, 1, true), new THREE.MeshStandardMaterial({ color: 0xfaf8f4, side: THREE.DoubleSide }));
                shade.position.y = 0.2;
                group.add(shade);
                body = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), new THREE.MeshStandardMaterial({ color: 0xfff8e0, emissive: 0xfff8e0, emissiveIntensity: 0 }));
                body.position.y = 0.12;
                const bulbGlow = new THREE.PointLight(0xfff5d0, 0, 6);
                bulbGlow.position.y = 0.1;
                group.add(bulbGlow);
                group.userData.bulbLight = bulbGlow;
            } else if (def.id === 'fridge') {
                body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.4, 0.6), new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.4 }));
            } else if (def.id === 'tv') {
                body = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.8, 0.05), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
                const stand = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 0.2), new THREE.MeshStandardMaterial({ color: 0x475569 }));
                stand.position.y = -0.45;
                group.add(stand);
            } else {
                body = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.8, 16), new THREE.MeshStandardMaterial({ color: def.color }));
            }

            body.castShadow = true;
            body.userData = { id: def.id };
            group.add(body);

            // Glow ring when active
            const ring = new THREE.Mesh(
                new THREE.RingGeometry(0.35, 0.42, 32),
                new THREE.MeshBasicMaterial({ color: def.color, transparent: true, opacity: 0, side: THREE.DoubleSide })
            );
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = -0.3;
            group.add(ring);
            group.userData.ring = ring;
            group.userData.body = body;
            group.userData.baseColor = def.color;

            // Label sprite
            const labelCanvas = document.createElement('canvas');
            labelCanvas.width = 256; labelCanvas.height = 64;
            const ctx = labelCanvas.getContext('2d');
            ctx.fillStyle = 'rgba(15,23,42,0.85)';

            ctx.fillStyle = '#fbbf24';
            ctx.font = 'bold 22px sans-serif';

            ctx.fillText(def.name, 128, 40);
            const labelTex = new THREE.CanvasTexture(labelCanvas);
            const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: labelTex, transparent: true }));
            label.position.y = 0.8;
            label.scale.set(1.5, 0.4, 1);
            group.add(label);

            scene.add(group);
            applianceMeshes[def.id] = group;
            return group;
        }

        applianceDefs.forEach(createApplianceMesh);

        // Selection highlight rings — links circuit schematic ↔ 3D
        const highlightRings = {};
        function ensureHighlightRing(id, parent) {
            if (highlightRings[id]) return highlightRings[id];
            const ring = new THREE.Mesh(
                new THREE.RingGeometry(0.55, 0.65, 32),
                new THREE.MeshBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0, side: THREE.DoubleSide })
            );
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = 0.05;
            parent.add(ring);
            highlightRings[id] = ring;
            return ring;
        }
        Object.entries(sceneNodes).forEach(([id, g]) => ensureHighlightRing(id, g));
        applianceDefs.forEach(def => {
            sceneNodes[def.id] = applianceMeshes[def.id];
            ensureHighlightRing(def.id, applianceMeshes[def.id]);
        });

        focusCameraOn = function (id) {
            const target = sceneNodes[id];
            if (!target) return;
            const pos = new THREE.Vector3();
            target.getWorldPosition(pos);
            controls.target.copy(pos);
            camera.position.set(pos.x + 3.5, pos.y + 2.5, pos.z + 3.5);
        };

        highlight3DNode = function (id) {
            Object.entries(highlightRings).forEach(([nid, ring]) => {
                const selected = nid === id;
                ring.material.opacity = selected ? 0.75 : 0;
                if (selected) ring.scale.setScalar(1 + Math.sin(Date.now() * 0.005) * 0.08);
            });
        };

        // ─── Power flow wire system ───
        const TRUNK_PATH = [
            NODES.grid,
            new THREE.Vector3(-6.5, 3.2, -4.7),
            NODES.meter,
            NODES.distBoard,
            new THREE.Vector3(-3.5, 0.18, -2.8),
            NODES.junction
        ];

        const HUB_TAP_PATH = [
            NODES.meter,
            new THREE.Vector3(-5.5, 1.0, -4.5),
            new THREE.Vector3(-4.5, 0.5, -4.3),
            NODES.hub
        ];

        function buildAppliancePath(def) {
            const target = new THREE.Vector3(def.position.x, def.position.y * 0.3, def.position.z);
            const mid = new THREE.Vector3(
                (NODES.junction.x + target.x) / 2,
                0.18,
                (NODES.junction.z + target.z) / 2
            );
            return [
                NODES.junction.clone(),
                mid,
                new THREE.Vector3(target.x, 0.18, target.z),
                new THREE.Vector3(def.position.x, def.position.y * 0.5, def.position.z),
                new THREE.Vector3(def.position.x, def.position.y, def.position.z)
            ];
        }

        const appliancePaths = {};
        applianceDefs.forEach(def => { appliancePaths[def.id] = buildAppliancePath(def); });

        function createWireTube(points, color, radius) {
            const curve = new THREE.CatmullRomCurve3(points);
            const geo = new THREE.TubeGeometry(curve, 48, radius, 6, false);
            const mat = new THREE.MeshStandardMaterial({
                color, emissive: color, emissiveIntensity: 0.05,
                metalness: 0.6, roughness: 0.4
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            scene.add(mesh);
            return { mesh, mat, curve, points };
        }

        function createFlowParticles(curve, count, color) {
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const phases = new Float32Array(count);
            for (let i = 0; i < count; i++) phases[i] = i / count;
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({
                color, size: 0.12, transparent: true, opacity: 0,
                blending: THREE.AdditiveBlending, depthWrite: false
            });
            const pts = new THREE.Points(geo, mat);
            scene.add(pts);
            return { pts, geo, mat, phases, curve, speed: 0.25 + Math.random() * 0.1 };
        }

        const wireIdleColor = 0x334155;
        const wireLiveColor = 0xfbbf24;
        const wireBranchColor = 0x10b981;

        const trunkWire = createWireTube(TRUNK_PATH, wireIdleColor, 0.035);
        const hubWire = createWireTube(HUB_TAP_PATH, wireIdleColor, 0.02);
        const trunkFlow = createFlowParticles(trunkWire.curve, 40, 0xfbbf24);
        const hubFlow = createFlowParticles(hubWire.curve, 12, 0x3b82f6);

        const branchWires = {};
        const branchFlows = {};
        applianceDefs.forEach(def => {
            const pts = appliancePaths[def.id];
            branchWires[def.id] = createWireTube(pts, wireIdleColor, 0.018);
            branchFlows[def.id] = createFlowParticles(branchWires[def.id].curve, 16, def.color);
        });

        let flowPhase = 0;
        let meterPulsePhase = 0;

        // Raycaster for clicks
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function resize() {
            const w = panel.clientWidth;
            const h = panel.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h, false);
        }
        window.addEventListener('resize', resize);
        resize();

        document.getElementById('resetCamBtn').addEventListener('click', () => {
            camera.position.set(6, 5, 8);
            controls.target.set(0, 1, 0);
            controls.update();
        });

        let simPaused = false;
        document.getElementById('toggleSimBtn').addEventListener('click', function () {
            simPaused = !simPaused;
            document.body.classList.toggle('sim-paused', simPaused);
            if (simPaused) {
                SimulationEngine.stop();
                this.innerHTML = '<i class="fas fa-play"></i> Resume';
                this.classList.add('paused-active');
            } else {
                SimulationEngine.start();
                this.innerHTML = '<i class="fas fa-pause"></i> Pause';
                this.classList.remove('paused-active');
            }
        });

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const meshes = Object.values(applianceMeshes).map(g => g.userData.body).filter(Boolean);
            const hits = raycaster.intersectObjects(meshes, true);
            if (hits.length) {
                const id = hits[0].object.userData.id;
                SimulationEngine.toggleAppliance(id);
                CircuitSchematic.selectNode(id);
                highlight3DNode(id);
                focusCameraOn(id);
            }
        });

        // Init integrated circuit schematic
        CircuitSchematic.init(document.getElementById('flowSvg'), function (id, type) {
            highlight3DNode(id);
            focusCameraOn(id);
            if (type === 'appliance') SimulationEngine.toggleAppliance(id);
        });

        // View tabs: 3D + Circuit or 3D only
        document.getElementById('tabBoth').addEventListener('click', () => {
            document.getElementById('circuitPanel').style.display = 'flex';
            document.getElementById('tabBoth').classList.add('active');
            document.getElementById('tab3d').classList.remove('active');
            resize();
        });
        document.getElementById('tab3d').addEventListener('click', () => {
            document.getElementById('circuitPanel').style.display = 'none';
            document.getElementById('tab3d').classList.add('active');
            document.getElementById('tabBoth').classList.remove('active');
            resize();
        });

        function updateSceneTheme() {
            const light = document.documentElement.getAttribute('data-theme') === 'light';
            scene.background = new THREE.Color(light ? 0x9ec8e8 : 0x1a2838);
            scene.fog.color = new THREE.Color(light ? 0xb8d4e8 : 0x1a2838);
            sun.intensity = light ? 1.2 : 0.75;
            ambient.intensity = light ? 0.45 : 0.25;
        }

        function updateApplianceVisuals(state) {
            state.appliances.forEach(a => {
                const group = applianceMeshes[a.id];
                if (!group) return;
                const body = group.userData.body;
                const ring = group.userData.ring;
                const color = group.userData.baseColor;

                if (a.id === 'lights' && body.material.emissive) {
                    body.material.emissiveIntensity = a.active ? 1.2 : 0;
                    interiorCeilingLight.intensity = a.active ? 0.85 : 0;
                    if (group.userData.bulbLight) group.userData.bulbLight.intensity = a.active ? 0.6 : 0;
                }
                if (ring) {
                    ring.material.opacity = a.active ? 0.6 : 0;
                }
                if (a.active) {
                    body.position.y = Math.sin(Date.now() * 0.003) * 0.02;
                } else if (a.id !== 'lights') {
                    body.position.y = 0;
                }
            });

            // Meter screen color by balance
            const bal = state.balanceKwh;
            meterScreen.material.color.setHex(bal < 20 ? 0xef4444 : bal < 100 ? 0xf59e0b : 0x10b981);
            meterLed.material.color.setHex(state.gridConnected ? 0x10b981 : 0xef4444);
        }

        function updateFlowParticles(flow, active, intensity, freeze) {
            flow.mat.opacity = active ? Math.min(0.95, 0.4 + intensity) : 0;
            if (!active || freeze) return;
            flowPhase += 0.016;
            const pos = flow.geo.attributes.position.array;
            const tmp = new THREE.Vector3();
            for (let i = 0; i < flow.phases.length; i++) {
                const t = (flow.phases[i] + flowPhase * flow.speed) % 1;
                flow.curve.getPoint(t, tmp);
                pos[i * 3] = tmp.x;
                pos[i * 3 + 1] = tmp.y;
                pos[i * 3 + 2] = tmp.z;
            }
            flow.geo.attributes.position.needsUpdate = true;
        }

        function setWireLive(wire, live, color) {
            wire.mat.color.setHex(live ? color : wireIdleColor);
            wire.mat.emissive.setHex(live ? color : 0x000000);
            wire.mat.emissiveIntensity = live ? 0.35 : 0.05;
        }

        function updatePowerFlow(state, paused) {
            const totalW = state.appliances.reduce((s, a) => s + a.power, 0);
            const hasBalance = state.balanceKwh > 0;
            const gridLive = state.gridConnected && hasBalance;
            const anyLoad = totalW > 0 && gridLive;
            const intensity = Math.min(1, totalW / 2000);

            setWireLive(trunkWire, gridLive, wireLiveColor);
            setWireLive(hubWire, gridLive, 0x3b82f6);
            updateFlowParticles(trunkFlow, anyLoad, intensity, paused);
            updateFlowParticles(hubFlow, gridLive, 0.5, paused);

            gridLight.intensity = gridLive ? 0.6 + intensity * 0.4 : 0;
            gridLight.color.setHex(anyLoad ? 0xfbbf24 : 0x10b981);

            if (!paused) meterPulsePhase += 0.05;
            meterPulse.material.opacity = anyLoad ? 0.3 + Math.sin(meterPulsePhase) * 0.2 : 0;
            meterPulse.scale.setScalar(anyLoad ? 1 + Math.sin(meterPulsePhase * 2) * 0.08 : 1);

            state.appliances.forEach(a => {
                const live = a.active && gridLive;
                setWireLive(branchWires[a.id], live, wireBranchColor);
                updateFlowParticles(branchFlows[a.id], live, a.power / 1500, paused);
                const group = applianceMeshes[a.id];
                if (group?.userData.body) {
                    group.userData.body.material.emissive = group.userData.body.material.emissive || new THREE.Color();
                    if (a.id !== 'lights') {
                        group.userData.body.material.emissive.setHex(live ? a.color : 0x000000);
                        group.userData.body.material.emissiveIntensity = live ? 0.25 : 0;
                    }
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            const state = SimulationEngine.getState();
            updateApplianceVisuals(state);
            updatePowerFlow(state, simPaused);
            const sel = CircuitSchematic.getSelectedId();
            if (sel) highlight3DNode(sel);
            renderer.render(scene, camera);
        }
        animate();

        // ─── UI Updates ───
        const sensorLabels = {
            voltage: 'Voltage', current: 'Current', power: 'Power',
            frequency: 'Frequency', power_factor: 'Power Factor',
            temperature: 'Temperature', humidity: 'Humidity',
            motion: 'Motion', smoke: 'Smoke', door: 'Door'
        };
        const sensorTypes = {
            voltage: 'ZMPT101B', current: 'SCT-013', power: 'PZEM-004T',
            frequency: 'ADE7953', power_factor: 'ADE7953',
            temperature: 'DHT22', humidity: 'DHT22',
            motion: 'PIR HC-SR501', smoke: 'MQ-2', door: 'Magnetic Reed'
        };

        const iotDevices = [
            { name: 'ESP32 IoT Gateway', type: 'WiFi/BLE Hub', icon: 'fa-wifi' },
            { name: 'PZEM-004T Energy Monitor', type: 'RS485 Modbus', icon: 'fa-bolt' },
            { name: 'SCT-013 Current Clamp', type: 'Analog Input', icon: 'fa-ring' },
            { name: 'ZMPT101B Voltage Module', type: 'Analog Input', icon: 'fa-plug' },
            { name: 'DHT22 Temp/Humidity', type: 'Digital GPIO', icon: 'fa-thermometer-half' },
            { name: 'PIR Motion Sensor', type: 'Digital GPIO', icon: 'fa-walking' },
            { name: 'MQ-2 Smoke Detector', type: 'Analog ADC', icon: 'fa-smog' },
            { name: 'Smart Plugs (×5)', type: 'Zigbee 3.0', icon: 'fa-plug' },
            { name: 'LoRaWAN Node', type: '915 MHz', icon: 'fa-broadcast-tower' }
        ];

        function renderIoTDevices() {
            document.getElementById('iotDeviceList').innerHTML = iotDevices.map(d => `
                <div class="iot-device">
                    <span class="iot-status"></span>
                    <i class="fas ${d.icon}" style="color:var(--secondary);width:16px"></i>
                    <div style="flex:1">
                        <div style="font-weight:600">${d.name}</div>
                        <div style="font-size:0.7rem;color:var(--text-light)">${d.type}</div>
                    </div>
                    <span style="font-size:0.7rem;color:var(--success)">Online</span>
                </div>
            `).join('');
        }

        function renderUI(state) {
            const totalW = state.appliances.reduce((s, a) => s + a.power, 0);
            document.getElementById('overlayPower').textContent = (totalW / 1000).toFixed(2) + ' kW';
            document.getElementById('meterBalance').textContent = state.balanceKwh.toFixed(1) + ' kWh';
            document.getElementById('meterId').textContent = state.meterNumber;
            document.getElementById('meterStatus').textContent = state.gridConnected ? 'Connected' : 'Disconnected';
            document.getElementById('meterStatus').style.color = state.gridConnected ? 'var(--success)' : 'var(--error)';

            const gridLive = state.gridConnected && state.balanceKwh > 0;
            const anyLoad = totalW > 0 && gridLive;

            CircuitSchematic.update(state);

            const pathSteps = [
                { icon: 'fa-broadcast-tower', label: 'TANESCO Grid', live: gridLive, detail: '230V AC supply' },
                { icon: 'fa-tachometer-alt', label: 'LUKU Prepaid Meter', live: anyLoad, detail: state.balanceKwh.toFixed(1) + ' kWh remaining' },
                { icon: 'fa-th-large', label: 'Distribution Board', live: anyLoad, detail: 'Circuit breakers' },
                { icon: 'fa-code-branch', label: 'Junction Box', live: anyLoad, detail: 'Splits to appliances' },
                ...state.appliances.map(a => ({
                    icon: a.icon,
                    label: a.name,
                    live: a.active && gridLive,
                    detail: a.active ? a.power + ' W flowing' : 'Circuit open'
                }))
            ];
            document.getElementById('powerPathList').innerHTML = pathSteps.map(s => `
                <div class="power-path-step ${s.live ? 'live' : ''}">
                    <span class="step-icon"><i class="fas ${s.icon}"></i></span>
                    <div>
                        <div style="font-weight:600">${s.label}</div>
                        <div style="font-size:0.65rem;color:var(--text-light)">${s.detail}</div>
                    </div>
                    <span class="step-arrow"><i class="fas fa-bolt"></i></span>
                </div>
            `).join('');

            // Sensors
            const grid = document.getElementById('sensorGrid');
            grid.innerHTML = Object.entries(state.sensors).map(([key, s]) => {
                const display = s.label || (s.value + (s.unit ? ' ' + s.unit : ''));
                return `<div class="sensor-card ${s.status}">
                    <div class="label">${sensorLabels[key] || key}</div>
                    <div class="reading">${display}</div>
                    <div class="type">${sensorTypes[key] || ''}</div>
                </div>`;
            }).join('');

            // Appliances
            document.getElementById('applianceList').innerHTML = state.appliances.map(a => `
                <div class="appliance-item ${a.active ? 'active' : ''}" data-id="${a.id}">
                    <div class="appliance-icon" style="background:#${a.color.toString(16).padStart(6,'0')}">
                        <i class="fas ${a.icon}"></i>
                    </div>
                    <div class="appliance-info">
                        <div class="name">${a.name}</div>
                        <div class="power">${a.active ? a.power + ' W' : 'Off'}</div>
                    </div>
                    <div class="toggle-switch ${a.active ? 'on' : ''}"></div>
                </div>
            `).join('');

            document.querySelectorAll('.appliance-item').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id;
                    SimulationEngine.toggleAppliance(id);
                    CircuitSchematic.selectNode(id);
                    highlight3DNode(id);
                    focusCameraOn(id);
                });
            });

            // Alerts
            const alertsEl = document.getElementById('alertsContainer');
            if (state.alerts.length === 0) {
                alertsEl.innerHTML = '<div class="alert-item info"><i class="fas fa-check-circle"></i> All systems normal</div>';
            } else {
                alertsEl.innerHTML = state.alerts.map(a => `
                    <div class="alert-item ${a.type}">
                        <i class="fas ${a.icon}"></i> ${a.message}
                    </div>
                `).join('');
            }
        }

        function showSimSmsToast(n) {
            if (!n) return;
            let t = document.getElementById('simSmsToast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'simSmsToast';
                t.style.cssText = 'position:fixed;top:4.5rem;right:1rem;z-index:3000;max-width:320px;padding:1rem;border-radius:0.6rem;background:#ecfdf5;border:1px solid #10b981;color:#047857;font-size:0.85rem;box-shadow:0 4px 16px rgba(0,0,0,0.15);display:none';
                document.body.appendChild(t);
            }
            t.style.display = 'block';
            t.innerHTML = `<strong><i class="fas fa-sms"></i> ${n.title}</strong><p style="margin:0.4rem 0 0">${n.message}</p>`;
            setTimeout(() => { t.style.display = 'none'; }, 8000);
        }

        SMSAlerts.setNotifyCallback(showSimSmsToast);
        renderIoTDevices();
        SimulationEngine.start();
        SimulationEngine.onUpdate(function(state) {
            renderUI(state);
            SMSAlerts.monitor(SimulationEngine.getDashboardSnapshot());
        });
        renderUI(SimulationEngine.getState());
    })();
    </script>
</body>
</html>
